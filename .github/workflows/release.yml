name: release
on:
  # Version tags publish Docker images and a GitHub Release, and attach the
  # signed desktop packages to it when their signing secrets are configured.
  # Manual runs publish only edge/sha images; no branch push, pull request,
  # merge group, or schedule starts this workflow.
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize release publisher
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$ACTOR" != chyroc || "$TRIGGERING_ACTOR" != chyroc ]]; then
            echo "Only chyroc can publish container images and GitHub Releases." >&2
            exit 1
          fi
  smoke:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Image version
        run: scripts/ci/hub-image.sh version
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: persona-hub:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            IMAGE=${{ steps.version.outputs.image }}
            NODE_PLATFORMS=linux/amd64
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max,timeout=2m,ignore-error=true
      - name: Isolated Compose smoke
        env:
          CI_IMAGE_VERSION: ${{ steps.version.outputs.version }}
          CI_IMAGE_PREBUILT: '1'
        run: scripts/ci/hub-image.sh
  publish:
    needs: [authorize, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.smoke.outputs.image }}
          flavor: latest=false
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.smoke.outputs.version }}
            IMAGE=${{ needs.smoke.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max,timeout=2m,ignore-error=true
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--latest=false --verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
  darwin-cli-sign:
    name: Sign Darwin command-line programs
    needs: [authorize, desktop-gate, publish]
    if: needs.desktop-gate.outputs.darwin_cli == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    environment: persona-desktop-release
    permissions:
      contents: write
    steps:
      - name: Check whether release-publish owns this tag's verified artifacts
        id: owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          owned=false
          if gh release view "$RELEASE_TAG" --json body --jq .body | grep -Eq '^release-pr: [0-9]+$'; then
            echo 'This Release belongs to a verified release PR; release-publish owns its exact artifacts.'
            owned=true
          fi
          printf 'release_pr=%s\n' "$owned" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.owner.outputs.release_pr == 'false'
        with:
          persist-credentials: false
      - name: Select reusable Release build
        if: steps.owner.outputs.release_pr == 'false'
        id: resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: python3 scripts/release/resume_github_release.py prepare --repository "$GH_REPO" --tag "$RELEASE_TAG" --commit "$COMMIT" --resume "$RUNNER_TEMP/release-resume.json" --output "$GITHUB_OUTPUT"
      - name: Build release command-line programs
        if: steps.owner.outputs.release_pr == 'false' && steps.resume.outputs.coordinated == 'false'
        env:
          VERSION: ${{ needs.desktop-gate.outputs.version }}
          PERSONA_RELEASE_BUILD: ${{ steps.resume.outputs.number }}
          NO_DEPLOY: '1'
          RELEASE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
        run: scripts/release/publish.sh
      - name: Install the existing signing certificate
        if: steps.owner.outputs.release_pr == 'false' && steps.resume.outputs.coordinated == 'false'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          PERSONA_SIGNING_KEYCHAIN: ${{ runner.temp }}/persona-cli-release.keychain
        run: |
          set -euo pipefail
          umask 077
          packet="$(mktemp "${RUNNER_TEMP}/persona-signing-XXXXXX.p12")"
          trap 'rm -f "$packet"' EXIT
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$packet"
          security create-keychain -p "$MAC_CSC_KEY_PASSWORD" "$PERSONA_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$PERSONA_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$MAC_CSC_KEY_PASSWORD" "$PERSONA_SIGNING_KEYCHAIN"
          security import "$packet" -k "$PERSONA_SIGNING_KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CSC_KEY_PASSWORD" "$PERSONA_SIGNING_KEYCHAIN"
          identity="$(security find-identity -v -p codesigning "$PERSONA_SIGNING_KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity" || { echo 'Darwin CLI signing blocked: No Developer ID Application signing identity is available.' >&2; exit 1; }
          printf '%s\n' "$identity" > "${RUNNER_TEMP}/persona-cli-signing-identity"
      - name: Sign and verify fixed-identifier binaries
        if: steps.owner.outputs.release_pr == 'false' && steps.resume.outputs.coordinated == 'false'
        run: |
          identity="$(cat "${RUNNER_TEMP}/persona-cli-signing-identity")"
          test -n "$identity" || { echo 'Darwin CLI signing blocked: No Developer ID Application signing identity is available.' >&2; exit 1; }
          python3 scripts/release/sign_darwin_cli.py build-publish/bin --identity "$identity"
      - name: Rebuild the manifest from the signed downloads
        if: steps.owner.outputs.release_pr == 'false' && steps.resume.outputs.coordinated == 'false'
        env:
          VERSION: ${{ needs.desktop-gate.outputs.version }}
          COMMIT: ${{ github.sha }}
          RELEASE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          host="build-publish/bin/personad-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          build="$(python3 -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/release-resume.json"))["build"])')"
          has_manifest="$(python3 -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/release-resume.json"))["has_manifest"])')"
          # publish.sh compressed the unsigned build. Replace every darwin archive with the signed bytes before hashing.
          for program in personad persona-node persona-link persona-hub persona-manager; do
            for architecture in amd64 arm64; do
              bin="build-publish/bin/${program}-darwin-${architecture}"
              gzip -n -9 -c "$bin" > "$bin.gz"
            done
          done
          (cd build-publish/bin && shasum -a 256 -- *.gz > ci-SHA256SUMS && printf '%s\n' "$VERSION" > VERSION)
          python3 scripts/release/resume_github_release.py restore --repository "$GH_REPO" --tag "$RELEASE_TAG" --commit "$COMMIT" --directory build-publish --resume "$RUNNER_TEMP/release-resume.json"
          if [ "$has_manifest" != True ]; then
            "$host" release manifest --dir build-publish/bin --version "$VERSION" --build "$build" --commit "$COMMIT" --channel "$RELEASE_CHANNEL" --out build-publish/bin/ci-latest.json
          elif [ ! -f build-publish/bin/ci-latest.json ]; then
            cp build-publish/bin/latest.json build-publish/bin/ci-latest.json
          fi
          "$host" release verify --dir build-publish/bin --manifest build-publish/bin/ci-latest.json
      - name: Upload signed Darwin downloads
        if: steps.owner.outputs.release_pr == 'false' && steps.resume.outputs.coordinated == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for f in build-publish/bin/*.gz build-publish/install.sh build-publish/bin/VERSION build-publish/bin/ci-latest.json build-publish/bin/ci-SHA256SUMS; do
            test -f "$f" || continue
            name="${f##*/}"
            case "$name" in
              *.exe.gz) echo "Windows native verification is supplied by the hub publisher: $name"; continue ;;
            esac
            local_digest="sha256:$(shasum -a 256 "$f" | awk '{print $1}')"
            existing="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "'"$name"'") | .digest')"
            if [ -n "$existing" ]; then
              [ "$existing" = "$local_digest" ] || { echo "conflicting Release asset: $name" >&2; exit 1; }
              echo "verified existing Release asset: $name"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$f"
            uploaded="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "'"$name"'") | .digest')"
            [ "$uploaded" = "$local_digest" ] || { echo "Release asset digest mismatch after upload: $name" >&2; exit 1; }
          done

  # they are signed: without the signing secrets the release still succeeds and this job says what was skipped and why.
  desktop-gate:
    name: Desktop packages gate
    needs: authorize
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Environment secrets are visible only in this protected context. Keep the existence check here, not in an
    # unbound job: the documented environment-only configuration would otherwise report every credential missing.
    environment: persona-desktop-release
    outputs:
      version: ${{ steps.gate.outputs.version }}
      mac: ${{ steps.gate.outputs.mac }}
      win: ${{ steps.gate.outputs.win }}
      darwin_cli: ${{ steps.gate.outputs.darwin_cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: gate
        name: Which desktop packages can be signed
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          # Only whether each secret exists reaches the script, never its value.
          HAS_PERSONA_DESKTOP_APP_ID: ${{ secrets.PERSONA_DESKTOP_APP_ID != '' }}
          HAS_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK != '' }}
          HAS_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK != '' }}
          HAS_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: scripts/ci/desktop-release-gate.sh
  desktop-mac:
    name: macOS desktop packages
    needs: [authorize, desktop-gate]
    if: needs.desktop-gate.outputs.mac == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    environment: persona-desktop-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop checks
        run: scripts/ci/desktop.sh
      - name: Build signed and notarized universal packages
        env:
          PERSONA_DESKTOP_VERSION: ${{ needs.desktop-gate.outputs.version }}
          PERSONA_DESKTOP_REQUIRE_SIGNING: '1'
          PERSONA_DESKTOP_APP_ID: ${{ secrets.PERSONA_DESKTOP_APP_ID }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/ci/desktop-package.sh mac
      - name: Verify the signature and notarization
        run: |
          app="desktop/release/mac-universal/Persona.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Gatekeeper accepts only a Developer ID signature with a notarization ticket.
          spctl --assess --type execute --verbose=2 "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: persona-desktop-release-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/*-mac.yml
          if-no-files-found: error
          retention-days: 7
  desktop-win:
    name: Windows desktop package
    needs: [authorize, desktop-gate]
    if: needs.desktop-gate.outputs.win == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    environment: persona-desktop-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop checks
        shell: bash
        run: scripts/ci/desktop.sh
      - name: Build signed NSIS package
        shell: bash
        env:
          PERSONA_DESKTOP_VERSION: ${{ needs.desktop-gate.outputs.version }}
          PERSONA_DESKTOP_REQUIRE_SIGNING: '1'
          PERSONA_DESKTOP_APP_ID: ${{ secrets.PERSONA_DESKTOP_APP_ID }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: scripts/ci/desktop-package.sh win
      - name: Verify the signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/release/*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          Write-Host "$($installer.Name): $($signature.Status)"
          if ($signature.Status -ne 'Valid') { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: persona-desktop-release-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7
  desktop-publish:
    name: Attach desktop packages to the Release
    needs: [publish, desktop-gate, desktop-mac, desktop-win]
    # One platform's packages are attached even when the other was skipped or failed.
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.desktop-mac.result == 'success' || needs.desktop-win.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: persona-desktop-release-*
          path: desktop-release
          merge-multiple: true
      - name: Upload packages, then the update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          packages=(desktop-release/*.dmg desktop-release/*.zip desktop-release/*.exe desktop-release/*.blockmap)
          metadata=(desktop-release/*.yml)
          if (( ${#packages[@]} == 0 || ${#metadata[@]} == 0 )); then
            echo "No desktop packages or update metadata were built." >&2
            exit 1
          fi
          # Installed apps read the metadata first: it must never name a package that is not there yet.
          gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
          gh release upload "$RELEASE_TAG" "${metadata[@]}" --clobber
          printf -- '- Attached to %s: %s\n' "$RELEASE_TAG" "$(basename -a "${packages[@]}" "${metadata[@]}" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
